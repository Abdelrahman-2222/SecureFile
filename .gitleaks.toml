# gitleaks configuration: keep every built-in rule and allow only published test vectors.
# Read automatically by gitleaks (local runs and the CI secrets scan) from the repository root.

[extend]
useDefault = true

[allowlist]
description = "Published known-answer test vectors (public values, not secrets)"
# Matched against the detected secret only, so each entry allows exactly one public value and nothing else.
regexes = [
  # NIST SP 800-38A, Appendix F.2.5/F.2.6: the AES-256 example key (tests/SecureFile.Core.Tests/Cryptography/AesCbcTests.cs).
  '''^603DEB1015CA71BE2B73AEF0857D77811F352C073B6108D72D9810A30914DFF4$''',
]
